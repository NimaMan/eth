[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyreth"
version = "0.5.0"
description = "Python bindings for Reth-based Ethereum tools - unified interface for transaction processing, simulation, and blockchain queries"
authors = [{name = "PyReth Team"}]
requires-python = ">=3.9"
keywords = ["ethereum", "reth", "blockchain", "transaction", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/yourusername/pyreth"
Documentation = "https://github.com/yourusername/pyreth/blob/main/README.md"
Repository = "https://github.com/yourusername/pyreth.git"
Issues = "https://github.com/yourusername/pyreth/issues"

[tool.maturin]
module-name = "pyreth"
