<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>{% block title %}Make Ethereum Great Again{% endblock %}</title>
    <style>
        {{ styles_bootstrap_css | safe }}
    </style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        {{ styles_css | safe }}
    </style>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css">
</head>

<body id="page-top">
    <div id="wrapper">
        <!-- Sidebar -->
        <nav class="navbar align-items-start sidebar sidebar-dark accordion bg-gradient-primary p-0 navbar-dark">
            <div class="container-fluid d-flex flex-column p-0">
                <a class="navbar-brand d-flex justify-content-center align-items-center sidebar-brand m-0" href="#">
                    <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-chart-line"></i></div>
                    <div class="sidebar-brand-text mx-3"><span>Mega</span></div>
                </a>
                <hr class="sidebar-divider my-0">
                <ul class="navbar-nav text-light" id="accordionSidebar" style="width: 100%;">
                    <li class="nav-item" style="width: 100%;"><a class="nav-link active" href="{{ url_for('main.index') }}" style="width: 100%;"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
                    <li class="nav-item" style="width: 100%;"><a class="nav-link active" href="{{ url_for('main.token_positions_table') }}" style="width: 100%;"><i class="fas fa-user"></i><span>Live Positions</span></a></li>
                    <li class="nav-item" style="width: 100%;"><a class="nav-link active" href="{{ url_for('main.backtest_results') }}" style="width: 100%;"><i class="fas fa-user"></i><span>Backtest Results</span></a></li>
                    <li class="nav-item" style="width: 100%;">
                        <a class="nav-link active" href="{{ url_for('main.token_position') }}" style="width: 100%;">
                            <i class="fas fa-user"></i><span>Token Position History</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column" >
            <!-- Main Content -->
            <div id="content">
                <div class="container-fluid">
                    {% block content %}{% endblock %}
                </div>
            </div>
            
            <!-- Footer -->
            <footer class="bg-white sticky-footer">
                <div class="container my-auto">
                    <div class="text-center my-auto copyright"><span>Make Ethereum Great Again</span></div>
                </div>
            </footer>

        </div>
        <!-- Scroll to Top Button-->
        <a class="border rounded d-inline scroll-to-top" href="#page-top">
            <i class="fas fa-angle-up">
            </i>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.html5.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script>
        {{ bs_init_js | safe }}
     </script>
    
    <script>
        {{ theme_js | safe }}
     </script>
    {% block scripts %}{% endblock %}
</body>
</html>
