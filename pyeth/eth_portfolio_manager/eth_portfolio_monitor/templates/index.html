{% extends "base.html" %}

{% block title %}ETH Portfolio Monitor{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>ETH Portfolio Monitor</h1>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Portfolio Overview</h5>
                    <div id="portfolio-summary">
                        <!-- Portfolio summary will be loaded here -->
                        <p>Loading portfolio data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Token Positions</h5>
                    <div id="token-positions">
                        <!-- Token positions table will be loaded here -->
                        <p>Loading token positions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
