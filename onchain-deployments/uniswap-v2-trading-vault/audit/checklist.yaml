schema: uniswap_v2_trading_vault_audit_checklist_v1
status: draft
items:
  - id: source-pinned
    area: source
    status: reviewed
    requirement: Record git revision, artifact hash, ABI hash, and dirty-state summary.
    evidence: runs/2026-05-19-mainnet-v1/artifact-hashes.json
    note: Current run folder records hashes and dirty-state evidence; recheck if source changes before deploy.
  - id: constructor-args-reviewed
    area: deployment
    status: reviewed
    requirement: Review owner, treasury, WETH, Uniswap V2 router, signer, and chain id.
    evidence: runs/2026-05-19-mainnet-v1/post-deploy-smoke.json
    note: Constructor behavior is tested and deployed immutable values match expected values.
  - id: owner-model-reviewed
    area: access-control
    status: reviewed
    requirement: Confirm owner address is the intended Kartal signer or explicitly delegated operational account.
    note: Owner-only behavior is tested; deployed owner is 0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27.
  - id: treasury-reviewed
    area: funds
    status: reviewed
    requirement: Confirm emergency-sell ETH proceeds go to the intended treasury.
    note: Treasury payout behavior is tested; deployed treasury is 0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27.
  - id: approval-lifecycle-reviewed
    area: token-allowance
    status: reviewed
    requirement: Confirm buy creates no sell-router allowance and emergency sell clears allowance after swap.
    evidence: audit/contract-test-gas-review-2026-05-19.md
  - id: fee-on-transfer-reviewed
    area: token-behavior
    status: reviewed
    requirement: Confirm FOT local and fork tests cover buy and emergency sell.
    evidence: audit/contract-test-gas-review-2026-05-19.md
  - id: gas-benchmark-reviewed
    area: gas
    status: reviewed
    requirement: Confirm fork gas snapshot is acceptable versus direct buy and approve plus sell.
    evidence: runs/2026-05-19-mainnet-v1/fork-rehearsal.txt
  - id: bribe-policy-reviewed
    area: gas-rank
    status: todo
    requirement: Confirm ranked gas candidates are required and unranked value-cap fallback is rejected.
    note: Blocked until alpha uses a production GasRankProvider backed by recent eth_block_tx_rank evidence instead of fixed shadow values.
  - id: final-simulation-reviewed
    area: simulation
    status: partial
    requirement: Confirm exact buy and emergency-sell calldata are simulated against current state before submission.
    evidence: onchain-deployments/uniswap-v2-trading-vault/simulations/
    note: Deployed-vault simulator now covers functional success and negative cases. Keep partial until the live planner's exact final Kartal request is simulated and attached for each real submission.
  - id: production-min-output-reviewed
    area: simulation
    status: todo
    requirement: Confirm public-broadcast requests reject empty min-output or 1-wei dry-run placeholders.
    note: Current real planner uses temporary 1-wei min-output and must stay dry-run only.
  - id: live-buy-route-reviewed
    area: alpha-state
    status: todo
    requirement: Confirm live entry route is implemented through the deployed vault, or the first public run is explicitly sell-only with entry disabled.
    note: Current real live trader requires --disable-entry.
  - id: kartal-policy-reviewed
    area: execution
    status: reviewed
    requirement: Confirm Kartal allowlist only permits the deployed vault target and strategy selectors.
    evidence: onchain-deployments/uniswap-v2-trading-vault/config/kartal-policy.mainnet.json
    note: Policy allows only 0x28474cbCd780AeEb3ED1501B68254bEd87cF5597 and selectors 0x8a62666c, 0x5f413d10.
  - id: dry-run-reviewed
    area: execution
    status: todo
    requirement: Confirm Kartal dry-run or safe policy-reject evidence is stored in the run folder.
  - id: receipt-reconciliation-reviewed
    area: alpha-state
    status: partial
    requirement: Confirm alpha records submitted, confirmed, reverted, or replaced outcomes.
    evidence: alpha/engine/src/live_trader/receipt_reconciliation.rs
    note: Receipt worker and unit tests exist. Keep partial until live integration evidence, finality depth, stuck tx handling, and replacement handling are reviewed.
  - id: finality-and-stuck-tx-reviewed
    area: alpha-state
    status: todo
    requirement: Confirm null receipts, dropped/replaced transactions, reorgs, and confirmation depth are handled before marking trades settled.
  - id: per-strategy-token-caps-reviewed
    area: execution
    status: todo
    requirement: Confirm Kartal enforces per-strategy and per-token spend caps in addition to per-tx and daily caps.
  - id: live-observability-reviewed
    area: operations
    status: todo
    requirement: Confirm frontend and logs expose broadcast mode, signer backend, execution disabled state, spend caps, submitted/confirmed/failed counts, unresolved receipts, and stuck tx age.
  - id: kill-switch-drill-reviewed
    area: operations
    status: todo
    requirement: Confirm KARTAL_EXECUTION_DISABLED stops signing/broadcast and the live trader reports the disabled state without corrupting positions.
  - id: post-deploy-smoke-reviewed
    area: deployment
    status: reviewed
    requirement: Confirm deployed immutable reads match expected owner, treasury, WETH, and router.
    evidence: runs/2026-05-19-mainnet-v1/post-deploy-smoke.json
  - id: signoff-complete
    area: release
    status: todo
    requirement: Record operator and reviewer signoff before enabling public broadcast.
