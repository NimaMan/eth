# Root configuration for the Rust workspace.

[workspace]
name = "eth-rust-monorepo"

[workspace.paths]
reth = "."
reth_chain_query = "reth_chain_query"
tx_simulator = "tx_simulator"
tx_processor = "tx_processor"
mempool_processor = "mempool_processor"
pyreth = "pyreth"

[lighthouse]
image = "sigp/lighthouse:v7.0.1"
rpc_endpoint = "http://localhost:5052"
metrics_endpoint = "http://localhost:5054"
execution_endpoint = "http://reth:8551"
jwt_path = "/home/nima/storage/samsung8tb/ethereum/jwt/jwt.hex"
checkpoint_sync_url = "https://sync-mainnet.beaconcha.in"
p2p_port_tcp = 9000
p2p_port_udp = 9000

[services]
reth_rpc = "http://127.0.0.1:8545"
reth_engine = "http://127.0.0.1:8551"
rabbitmq_url_env = "RABBITMQ_URL"

[databases.alpha]
url = "postgresql://postgres:postgres@localhost:5432/eth_db"

[databases.risk_atlas]
url = "postgresql://postgres:postgres@localhost:5432/eth_db"

[databases.mempool]
url = "postgresql://postgres:postgres@localhost:5432/eth_db"

[databases.token_pnl]
url = "postgresql://postgres:postgres@localhost:5432/eth_db"

[databases.token_state]
url = "postgresql://postgres:postgres@localhost:5432/eth_db"

[ethereum.mainnet.contracts]
weth = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
uniswap_v2_router = "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
uniswap_v2_trading_vault = "0x28474cbCd780AeEb3ED1501B68254bEd87cF5597"

[ethereum.mainnet.trading_vaults.uniswap_v2]
address = "0x28474cbCd780AeEb3ED1501B68254bEd87cF5597"
owner = "0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27"
treasury = "0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27"
router = "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
custody_model = "vault_holds_bought_tokens_and_sells_with_exact_internal_approval"

[eth_tx_executor]
bind = "127.0.0.1:5006"
rpc_url = "http://127.0.0.1:8545"
database_url = "postgresql://postgres:postgres@localhost:5432/eth_db"
chain_id = 1
private_key_env = "ETH_EXECUTOR_PRIVATE_KEY"
signer_backend = "unix_socket"
signer_socket_path = "/run/eth-tx-executor/signer.sock"
signer_address = "0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27"
broadcast_mode = "dry_run"
max_priority_fee_per_gas_wei = 3500000000
max_fee_per_gas_wei = 5000000000
local_journal_path = "/home/nima/code/crypto/blockchains/eth/tx_executor/.state/executions.jsonl"

[eth_tx_policy]
version = "eth_tx_policy_v1"
allowed_from_addresses = ["0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27"]
allowed_targets = ["0x28474cbCd780AeEb3ED1501B68254bEd87cF5597"]
allowed_selectors = ["0x8a62666c", "0x5f413d10"]
max_value_wei = 5000000000000000
max_gas_limit = 300000
max_fee_per_gas_wei = 5000000000
max_priority_fee_per_gas_wei = 3500000000
max_transaction_cost_wei = 7500000000000000
max_daily_cost_wei = 0
require_simulation = true
max_simulation_age_blocks = 2
required_metadata_fields = [
  "wire_protocol",
  "intent_kind",
  "strategy_name",
  "strategy_run_id",
  "trade_id",
  "token_address",
  "pool_address",
]

[eth_signer]
socket_path = "/run/eth-tx-executor/signer.sock"
socket_mode = "0600"
chain_id = 1
key_backend = "keystore"
signer_address = "0x2348E8a3A21DBe64Ace84853D7b4B696E8A1fC27"
# keystore_path = "/run/eth-tx-executor/secrets/eth-signer-keystore.json"
# password_file = "/run/eth-tx-executor/secrets/eth-signer-password"
# password_env = "ETH_TX_SIGNER_KEYSTORE_PASSWORD"
journal_path = "/home/nima/code/crypto/blockchains/eth/tx_executor/.state/signer/decisions.jsonl"
allowed_targets = ["0x28474cbCd780AeEb3ED1501B68254bEd87cF5597"]
allowed_selectors = ["0x8a62666c", "0x5f413d10"]
max_value_wei = 5000000000000000
max_gas_limit = 300000
max_fee_per_gas_wei = 5000000000
max_priority_fee_per_gas_wei = 3500000000
max_transaction_cost_wei = 7500000000000000
