[package]
name = "fundflownetwork_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "fundflownetwork_py"
crate-type = ["cdylib"]

[dependencies]
# Core dependencies
qarqa-fundflownetwork = { path = "../fundflownetwork" }
qarqa-core-types = { path = "../core_types" }
qarqa-eth-db-fetcher = { path = "../eth_db_fetcher" }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
pyo3-asyncio-0-21 = { version = "0.22", features = ["tokio-runtime"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Ethereum types
alloy-primitives = { workspace = true }

# Error handling
eyre = "0.6"

[profile.release]
lto = "thin"