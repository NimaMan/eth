[package]
name = "fund-flow-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fund_flow_pipeline"
path = "../fund_flow_pipeline.rs"

[dependencies]
qarqa-eth-db-fetcher = { path = "../../eth_db_fetcher" }
qarqa-fundflownetwork = { path = "../../fundflownetwork" }
tx_processor = { path = "../../../tx_processor" }
alloy-primitives = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
eyre = "0.6"
serde_json = "1.0"