[package]
name = "data_access_example"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "database_connection"
path = "database_connection.rs"

[[bin]]
name = "address_lookup"
path = "address_lookup.rs"

[[bin]]
name = "transaction_fetching"
path = "transaction_fetching.rs"

[dependencies]
qarqa-core-types = { path = "../../core_types" }
qarqa-data-access = { path = "../../data_access" }
alloy = { version = "0.5", features = ["consensus", "rpc", "rpc-types", "network", "signer-local"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }