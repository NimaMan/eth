[package]
name = "core_types_example"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "basic_types"
path = "basic_types.rs"

[[bin]]
name = "transaction_parsing"
path = "transaction_parsing.rs"

[[bin]]
name = "error_handling"
path = "error_handling.rs"

[[bin]]
name = "simple_transaction"
path = "simple_transaction.rs"

[[bin]]
name = "simple_errors"
path = "simple_errors.rs"

[dependencies]
qarqa-core-types = { path = "../../core_types" }
alloy = { version = "0.5", features = ["consensus", "rpc", "rpc-types", "network", "signer-local"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
chrono = "0.4"