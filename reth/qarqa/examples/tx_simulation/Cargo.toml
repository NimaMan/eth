[package]
name = "tx_simulation_example"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "development_simulator"
path = "development_simulator.rs"

[[bin]]
name = "fund_flow_analysis"
path = "fund_flow_analysis.rs"

[[bin]]
name = "state_changes"
path = "state_changes.rs"

[dependencies]
qarqa-core-types = { path = "../../core_types" }
qarqa-data-access = { path = "../../data_access" }
qarqa-tx-simulation = { path = "../../tx_simulation" }
alloy = { version = "0.5", features = ["consensus", "rpc", "rpc-types", "network", "signer-local"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
chrono = "0.4"