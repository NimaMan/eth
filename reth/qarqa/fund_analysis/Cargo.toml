[package]
name = "qarqa-fund-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
qarqa-core-types = { path = "../core_types" }
alloy-primitives = "0.8"
tracing = "0.1"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }