[package]
name = "qarqa-api-layer"
version = "0.1.0"
edition = "2021"
description = "CLI and API interfaces for QARQA analytics"

[[bin]]
name = "qarqa"
path = "src/bin/qarqa.rs"

[[bin]]
name = "qarqa-analyze"
path = "src/bin/qarqa-analyze.rs"

[[bin]]
name = "test_integration"
path = "../test_integration.rs"

[[bin]]
name = "test_complete_analysis"
path = "../test_complete_analysis.rs"

[dependencies]
# Local dependencies
qarqa-core-types = { path = "../core_types" }
qarqa-data-access = { path = "../data_access" }
qarqa-eth-db-fetcher = { path = "../eth_db_fetcher" }
qarqa-fundflownetwork = { path = "../fundflownetwork" }

# CLI
clap = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Ethereum
alloy-primitives = { workspace = true }

# Database
sqlx = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Time
chrono = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }