[package]
name = "qarqa-tx-simulation"
version = "0.1.0"
edition = "2021"
description = "Transaction simulation using REVM for fund flow extraction"

[dependencies]
# Local dependencies
qarqa-core-types = { path = "../core_types" }
qarqa-data-access = { path = "../data_access" }

# Ethereum types
alloy-primitives = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

# REVM integration
revm_tx_simulator = { path = "../../revm_tx_simulator" }

# HTTP client for RPC calls
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }