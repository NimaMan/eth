[package]
name = "eth_env"
version = "0.1.0"
edition = "2021"
description = "On-chain simulation environments backed by Reth + eth_prices+ tx_processor + tx_simulator"
authors = ["Nima <nima.manaf8@gmail.com>"]

[dependencies]
eth_prices = { path = "../eth_prices" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
eyre = "0.6"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
async-trait = "0.1"
reth_chain_query = { path = "../reth_chain_query" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
tx_simulator = { path = "../tx_simulator" }

[lib]
name = "eth_env"
path = "src/lib.rs"

[[example]]
name = "eth15m"
path = "examples/eth15m/main.rs"
