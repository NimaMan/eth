# Root configuration for the Rust workspace.

[workspace]
name = "eth-rust-monorepo"

[workspace.paths]
reth = "rust/reth"
reth_chain_query = "rust/reth_chain_query"
tx_simulator = "rust/tx_simulator"
tx_processor = "rust/tx_processor"
mempool_processor = "rust/mempool_processor"
pyreth = "rust/pyreth"

[lighthouse]
image = "sigp/lighthouse:v7.0.1"
rpc_endpoint = "http://localhost:5052"
metrics_endpoint = "http://localhost:5054"
execution_endpoint = "http://reth:8551"
jwt_path = "rust/reth/jwttoken/jwt.hex"
checkpoint_sync_url = "https://sync-mainnet.beaconcha.in"
p2p_port_tcp = 9000
p2p_port_udp = 9000

[live_data_registry]
redis_url_env = "LIVE_BLOCKCHAIN_DATA_REDIS_URL"
block_header_prefix = "block:block_header:"
processed_transactions_prefix = "block:processed_transactions:"
latest_block_number_key = "block:latest_block_number"
chain_state_snapshot_prefix = "block:chain_state_snapshot:"
latest_chain_state_block_number_key = "block:latest_chain_state_block_number"

[services]
reth_rpc = "http://127.0.0.1:8545"
reth_engine = "http://127.0.0.1:8551"
rabbitmq_url_env = "RABBITMQ_URL"
