[dependencies]
# Use the working modular tx_simulator (NOT the broken reth_tx_simulator)
tx_simulator = { path = "../tx_simulator" }


# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
hex-literal = "0.4"
alloy-primitives = "1.1.2"
rlp = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
reqwest = { version = "0.11", features = ["json"] } # For benchmark comparison with Python
futures = "0.3"
lazy_static = "1.5"

# Basic Alloy dependencies for examples
alloy-consensus = "1.0.0"

# Add jsonrpsee for RPC calls
jsonrpsee = { version = "0.24", features = ["client", "ws-client", "http-client"] }

# Add alloy-rpc-types-trace for CallLogFrame
alloy-rpc-types-trace = "1.0"

# Add reth_chain_query for direct database access
reth_chain_query = { path = "../reth_chain_query" }

reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }

[dev-dependencies]
rand = "0.8"
