[package]
name    = "tx_processor"
version = "0.1.0"
edition = "2021"

# Clean TX Processor - Rust alternative to Python eth_block_processor
# Uses reth_tx_simulator for all transaction simulation

[lib]
name = "tx_processor"
path = "src/lib.rs"

# Clean tx_processor examples
[[example]]
name = "tx_processor_demo"
path = "examples/tx_processor_demo.rs"

# Removed examples that were deleted

[[example]]
name = "fetch_by_hash_benchmark"
path = "examples/fetch_by_hash_benchmark.rs"

[[example]]
name = "measure_processing_time"
path = "examples/measure_processing_time.rs"

[[example]]
name = "test_core_objective"
path = "examples/test_core_objective.rs"

[[example]]
name = "fetch_single_transaction"
path = "examples/fetch_single_transaction.rs"

[[example]]
name = "benchmark_1k_transactions"
path = "examples/benchmark_1k_transactions.rs"

[[bin]]
name = "batch_processor"
path = "src/bin/batch_processor.rs"

[dependencies]
# Use the new Direct Reth Transaction Simulator
reth_tx_simulator = { path = "../reth_tx_simulator" }

# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
alloy-primitives = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] } # For benchmark comparison with Python
futures = "0.3"

# Reth dependencies for direct database access
reth-provider = { path = "../reth/crates/storage/provider" }
reth-node-types = { path = "../reth/crates/node/types" }
reth-node-ethereum = { path = "../reth/crates/ethereum/node" }
reth-primitives = { path = "../reth/crates/primitives" }
reth-db = { path = "../reth/crates/storage/db" }
reth-chainspec = { path = "../reth/crates/chainspec" }
alloy-consensus = "1.0.20"