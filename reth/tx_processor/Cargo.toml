[package]
name    = "tx_processor"
version = "0.1.0"
edition = "2021"

# Clean TX Processor - Rust alternative to Python eth_block_processor
# Uses reth_tx_simulator for all transaction simulation

[lib]
name = "tx_processor"
path = "src/lib.rs"

# Clean tx_processor example
[[example]]
name = "tx_processor_demo"
path = "examples/tx_processor_demo.rs"

[dependencies]
# Use the new Direct Reth Transaction Simulator
reth_tx_simulator = { path = "../reth_tx_simulator" }

# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
alloy-primitives = "1.1.2"