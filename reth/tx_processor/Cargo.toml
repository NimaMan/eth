[package]
name    = "tx_processor"
version = "0.1.0"
edition = "2021"

# Clean TX Processor - Rust alternative to Python eth_block_processor
# Uses reth_tx_simulator for all transaction simulation

[lib]
name = "tx_processor"
path = "src/lib.rs"

# Clean tx_processor examples
[[example]]
name = "tx_processor_demo"
path = "examples/tx_processor_demo.rs"

[[example]]
name = "simple_simulation"
path = "examples/simple_simulation.rs"

[[example]]
name = "process_real_transaction"
path = "examples/process_real_transaction.rs"

[[example]]
name = "compare_with_python"
path = "examples/compare_with_python.rs"

[[example]]
name = "full_comparison_test"
path = "examples/full_comparison_test.rs"

[dependencies]
# Use the new Direct Reth Transaction Simulator
reth_tx_simulator = { path = "../reth_tx_simulator" }

# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
alloy-primitives = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }