# revm-database    = { path = "src/revm/crates/database" }
# revm-state       = { path = "src/revm/crates/state"}
# revm-bytecode    = { path = "src/revm/crates/bytecode"}
# revm-precompile  = { path = "src/revm/crates/precompile"}
# revm-handler     = { path = "src/revm/crates/handler"}
# revm-context-interface = { path = "src/revm/crates/context/interface" }

# DO NOT patch reth_primitives here; its path is absolute.
