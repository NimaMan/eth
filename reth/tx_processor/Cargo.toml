[package]
name    = "tx_processor"
version = "0.2.0"
edition = "2021"

[features]
default = []

# Clean TX Processor - Rust alternative to Python eth_data
# Uses reth_tx_simulator for all transaction simulation

[lib]
name = "tx_processor"
path = "src/lib.rs"
crate-type = ["rlib"]  # Library only, no Python bindings

# Clean tx_processor examples
# Examples that actually exist

[[example]]
name = "compare_with_python"
path = "examples/compare_with_python.rs"

[[example]]
name = "simulate_unsigned_transaction"
path = "examples/simulation/test_simulate_unsigned_transaction.rs"

[[example]]
name = "process_transaction_by_hash"
path = "examples/process_transaction_by_hash.rs"

[[example]]
name = "single_pass_token_trading_simulation"
path = "examples/single_pass_token_trading_simulation.rs"

# Pool analysis examples
[[example]]
name = "erc20_pool_basic_analysis"
path = "examples/pool_analysis/erc20_pool_basic_analysis.rs"

[[example]]
name = "erc20_pool_liquidity_removal_simple"
path = "examples/pool_analysis/erc20_pool_liquidity_removal_simple.rs"

[[example]]
name = "erc20_pool_tax_demo"
path = "examples/pool_analysis/erc20_pool_tax_demo.rs"

[[example]]
name = "erc20_pool_uniswap_v3"
path = "examples/pool_analysis/erc20_pool_uniswap_v3.rs"

[[example]]
name = "erc20_pool_usdc_v2"
path = "examples/pool_analysis/erc20_pool_usdc_v2.rs"

[[example]]
name = "erc20_pool_with_enable_tx"
path = "examples/pool_analysis/erc20_pool_with_enable_tx.rs"

[[example]]
name = "token_trading_viability_simulation"
path = "examples/pool_analysis/token_trading_viability_simulation.rs"

[[example]]
name = "erc20_pool_moo_token"
path = "examples/pool_analysis/erc20_pool_moo_token.rs"

[[example]]
name = "erc20_pool_block_range_analysis"
path = "examples/pool_analysis/erc20_pool_block_range_analysis.rs"

[dependencies]
# Use the new Direct Reth Transaction Simulator
reth_tx_simulator = { path = "../reth_tx_simulator" }
reth_chain_query = { path = "../reth_chain_query" }


# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
hex-literal = "0.4"
alloy-primitives = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
reqwest = { version = "0.11", features = ["json"] } # For benchmark comparison with Python
futures = "0.3"

# Reth dependencies for direct database access
reth-provider = { path = "../reth/crates/storage/provider" }
reth-node-types = { path = "../reth/crates/node/types" }
reth-node-ethereum = { path = "../reth/crates/ethereum/node" }
reth-primitives = { path = "../reth/crates/primitives" }
reth-db = { path = "../reth/crates/storage/db" }
reth-chainspec = { path = "../reth/crates/chainspec" }
alloy-consensus = "1.0.20"

