[package]
name    = "revm_tx_simulator"
version = "0.1.0"
edition = "2021"

# ──────────────────────────────── Library ─────────────────────────────────
[lib]
name = "revm_tx_simulator_lib"
path = "src/lib.rs"

# ──────────────────────────────── Examples ────────────────────────────────
# Cargo will automatically find examples in the examples/ directory.
# [[bin]]
# name = "signed_from_scratch_empty_db"
# path = "examples/signed_from_scratch_empty_db.rs"
# 
# [[bin]]
# name = "mempool_like_ethers_db"
# path = "examples/mempool_like_ethers_db.rs"

# ────────────────────────────── Top-level deps ────────────────────────────
[dependencies]
# Revm - directly path-based to use local clone
# Removed "ethersdb" feature. EthersDB comes from revm-inspector.
revm = { path = "src/revm/crates/revm", default-features = false, features = ["std", "alloydb", "asyncdb"] }
# revm-inspector = { path = "src/revm/crates/inspector", default-features = false, features = ["std"] } # Likely not needed directly

# Direct REVM sub-crate dependencies (needed for direct type imports in lib or examples if not re-exported by main revm)
revm-primitives = { path = "src/revm/crates/primitives", default-features = false, features = ["std"] }
# revm-database = { path = "src/revm/crates/database", default-features = false } # For CacheDB, AlloyDB if not re-exported by revm
revm-context = { path = "src/revm/crates/context", default-features = false } # For BlockEnv, CfgEnv, TxEnv, RevmContext, Journal
# revm-interpreter = { path = "src/revm/crates/interpreter", default-features = false } // Commented out as unused by this example now
# revm-bytecode = { path = "src/revm/crates/bytecode", default-features = false } # Unused by current example
# revm-state = { path = "src/revm/crates/state", default-features = false } # Unused by current example
# revm-database-interface = { path = "src/revm/crates/database/interface", default-features = false, features = ["serde"] } # Unused by current example

# Tokio - version from revm workspace
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }

# --- Dependencies for signed_tx_simulation based on Reth's approach (some still useful) ---
# reth-primitives = { path = "/home/nima/code/crypto/rust/reth/crates/primitives", default-features = false } # Keep if needed for other examples
# alloy-rlp = { version = "0.3.12", default-features = false } # Keep if needed

# --- Original Alloy dependencies (for main.rs and potentially still needed by revm's alloydb) ---
# alloy-sol-types = { version = "1.1.2", default-features = false, features = ["std"] }
# alloy-json-abi = { version = "1.1.2", default-features = false, features = ["std"] }
# alloy-primitives = { version = "1.1.2", default-features = false, features = ["serde", "std", "sha3-keccak"] }
# alloy-rpc-types = { version = "1.0.6", default-features = true }
# alloy-serde = { version = "1.0.6", default-features = false, features = ["std"] }

alloy-eips = { version = "1.0.0", default-features = false }
alloy-provider = { version = "1.0.6", default-features = false, features = ["reqwest", "ws"] }
# alloy-primitives = { version = "1.1.2", default-features = false, features = ["sha3-keccak"] } # If alloy primitives used directly - replaced by 0.7
alloy-network = { version = "1.0.6" }
# alloy-consensus = { version = "1.0.6", default-features = false }
# alloy-rpc-client = { version = "1.0.6", features = ["reqwest"] } - replaced by 0.7

# Ethers-rs dependencies
ethers-core = "2.0.14"
# ethers-signers = "2.0.14"
ethers-providers = "2.0.14"

# Other utilities
hex = "0.4.3"
chrono = "0.4"
# url = "2.5"

# Anyhow
anyhow = "1.0.89"

# Tracing (for example binary)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2" # For file-based logging
tracing = "0.1" # Core tracing macros
# tracing-core = "0.1" # Core tracing macros - this is a dep of tracing, not needed directly usually

# Alloy client dependencies (ensure these are present if not pulled by alloy-provider)
# alloy-rpc-client = { version = "1.0.6", features = ["reqwest", "ws"] }
# alloy-transport-http = { version = "1.0.6", features = ["reqwest"] }

# ───────────────────────────── Patch section ──────────────────────────────
[patch.crates-io]
revm-primitives  = { path = "src/revm/crates/primitives" }
# revm-interpreter = { path = "src/revm/crates/interpreter" }
revm-context     = { path = "src/revm/crates/context" }
revm-inspector   = { path = "src/revm/crates/inspector" }
revm-database    = { path = "src/revm/crates/database" }
revm-state       = { path = "src/revm/crates/state"}
revm-bytecode    = { path = "src/revm/crates/bytecode"}
revm-precompile  = { path = "src/revm/crates/precompile"}
revm-handler     = { path = "src/revm/crates/handler"}
revm-context-interface = { path = "src/revm/crates/context/interface" }

# DO NOT patch reth_primitives here; its path is absolute.
# DO NOT patch alloy-* crates here; let them come from crates.io per versions in [dependencies].