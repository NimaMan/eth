# ────────────────────────────── Top-level deps ────────────────────────────
[dependencies]
# Revm - Using latest versions for best performance and features
revm = { version = "25.0.0", default-features = false, features = ["std", "alloydb", "asyncdb"] }

# Direct REVM sub-crate dependencies (latest versions)
revm-primitives = { version = "19.2.0", default-features = false, features = ["std"] }
revm-state = { version = "5.0.0", default-features = false }
revm-context = { version = "6.0.0", default-features = false } # For BlockEnv, CfgEnv, TxEnv, RevmContext, Journal
revm-inspector = { version = "6.0.0", default-features = false } # For call tracing
revm-interpreter = { version = "21.0.0", default-features = false } # For call tracer types
revm-database = { version = "5.0.0", default-features = false } # For CacheDB, AlloyDB
revm-handler = { version = "6.0.0", default-features = false } # For EthPrecompiles, EthInstructions

# Tokio - version from revm workspace
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }

# CLI dependencies
clap = "2.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"

# --- Dependencies for signed_tx_simulation based on Reth's approach (some still useful) ---
# reth-primitives = { path = "/home/nima/code/crypto/rust/reth/crates/primitives", default-features = false } # Keep if needed for other examples
# alloy-rlp = { version = "0.3.12", default-features = false } # Keep if needed

# --- Original Alloy dependencies (for main.rs and potentially still needed by revm's alloydb) ---
# alloy-sol-types = { version = "1.1.2", default-features = false, features = ["std"] }
# alloy-json-abi = { version = "1.1.2", default-features = false, features = ["std"] }
# alloy-primitives = { version = "1.1.2", default-features = false, features = ["serde", "std", "sha3-keccak"] }
# alloy-rpc-types = { version = "1.0.6", default-features = true }
# alloy-serde = { version = "1.0.6", default-features = false, features = ["std"] }

alloy-eips = { version = "1.0.0", default-features = false }
alloy-provider = { version = "1.0.6", default-features = false, features = ["reqwest", "ws"] }
# alloy-primitives = { version = "1.1.2", default-features = false, features = ["sha3-keccak"] } # If alloy primitives used directly - replaced by 0.7
alloy-network = { version = "1.0.6" }
# alloy-consensus = { version = "1.0.6", default-features = false }
# alloy-rpc-client = { version = "1.0.6", features = ["reqwest"] } - replaced by 0.7

# Ethers-rs dependencies
ethers-core = "2.0.14"
ethers-signers = "2.0.14"
ethers-providers = "2.0.14"

# Other utilities
# hex = "0.4.3" # Duplicate removed - using 0.4 above
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
bytes = "1.5"

# Reth dependencies for direct database access
reth-ethereum = { path = "../reth/crates/ethereum/reth", features = ["node"] }  # Re-enabled to test with external REVM
reth-db = { path = "../reth/crates/storage/db", default-features = false }
reth-provider = { path = "../reth/crates/storage/provider", default-features = false }
reth-chainspec = { path = "../reth/crates/chainspec", default-features = false }
reth-primitives = { path = "../reth/crates/primitives", default-features = false }
alloy-primitives = { version = "1.1.2", default-features = false, features = ["serde", "std", "sha3-keccak"] }
alloy-rpc-types = { version = "1.0.6", default-features = true }
alloy-transport-http = { version = "1.0.6", features = ["reqwest"] }

# Anyhow
# anyhow = "1.0.89" # Duplicate removed - using 1.0 above

# Tracing (for example binary)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2" # For file-based logging
tracing = "0.1" # Core tracing macros
# tracing-core = "0.1" # Core tracing macros - this is a dep of tracing, not needed directly usually

# Additional dependencies for fetch_from_reth module
dirs = "5.0"  # For default data directory detection
num_cpus = "1.16"  # For performance configuration
alloy-consensus = { version = "1.0.6", default-features = false }  # For transaction types

# Additional Reth dependencies for fetch_from_reth
reth-primitives-traits = { path = "../reth/crates/primitives-traits", default-features = false }
reth-storage-errors = { path = "../reth/crates/storage/errors", default-features = false }
reth-node-types = { path = "../reth/crates/node/types", default-features = false }

# Dependencies for process_tx module  
url = "2.5"  # For URL parsing

# Alloy client dependencies (ensure these are present if not pulled by alloy-provider)
# alloy-rpc-client = { version = "1.0.6", features = ["reqwest", "ws"] }
# alloy-transport-http = { version = "1.0.6", features = ["reqwest"] }

# ───────────────────────────── Patch section ──────────────────────────────
