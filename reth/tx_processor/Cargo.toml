[package]
name    = "tx_processor"
version = "0.4.0"
edition = "2021"

[features]
default = []

# TX Processor Examples - Uses modular tx_simulator for simulation
# Note: Library functionality broken after refactoring, examples work

# TX Processor Examples - Only examples that actually exist

# Transaction Processing examples  
[[example]]
name = "process_transaction_by_hash"
path = "examples/tx_processor/process_transaction_by_hash.rs"

[[example]]
name = "processed_tx_from_unsigned_tx"
path = "examples/tx_processor/processed_tx_from_unsigned_tx.rs"

[[example]]
name = "test_bribe_detection"
path = "examples/tx_processor/test_bribe_detection.rs"

# Simulation examples
[[example]]
name = "process_block"
path = "examples/block/process_block.rs"

[[example]]
name = "process_block_batch"
path = "examples/block/process_block_batch.rs"

[[example]]
name = "compare_block_sources"
path = "examples/block/compare_block_sources.rs"

[[example]]
name = "provider_process_block"
path = "examples/provider/process_block.rs"

[[example]]
name = "provider_token_transactions"
path = "examples/provider/token_transactions.rs"

[[example]]
name = "fetch_processed_tx"
path = "examples/provider/fetch_processed_tx.rs"

[[example]]
name = "buy_swap_uniswap_v4"
path = "examples/simulation/buy_swap_uniswap_v4.rs"


# Pool analysis examples
[[example]]
name = "erc20_pool_tax_demo"
path = "examples/pool_analysis/erc20_pool_tax_demo.rs"

[[example]]
name = "erc20_pool_with_enable_tx"
path = "examples/pool_analysis/erc20_pool_with_enable_tx.rs"

[[example]]
name = "erc20_pool_liquidity_removal_simple"
path = "examples/pool_analysis/erc20_pool_liquidity_removal_simple.rs"

[[example]]
name = "erc20_pool_block_range_analysis"
path = "examples/pool_analysis/erc20_pool_block_range_analysis.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v2"
path = "examples/pool_analysis/can_buy_sell_common_tokens_uniswap_v2.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v3"
path = "examples/pool_analysis/can_buy_sell_common_tokens_uniswap_v3.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v4"
path = "examples/pool_analysis/can_buy_sell_common_tokens_uniswap_v4.rs"

[[example]]
name = "usdc_to_dai_uniswap_v3"
path = "examples/pool_analysis/usdc_to_dai_uniswap_v3.rs"

[[example]]
name = "live_block_service"
path = "examples/live/run_live_block_service.rs"

[dependencies]
# Use the working modular tx_simulator (NOT the broken reth_tx_simulator)
tx_simulator = { path = "../tx_simulator" }


# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
hex-literal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
alloy-primitives = "1.1.2"
alloy-eips = "1.0.38"
rlp = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
reqwest = { version = "0.11", features = ["json"] } # For benchmark comparison with Python
futures = "0.3"
lazy_static = "1.5"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Basic Alloy dependencies for examples
alloy-consensus = "1.0.0"

# Add jsonrpsee for RPC calls
jsonrpsee = { version = "0.24", features = ["client", "ws-client", "http-client"] }

# Add alloy-rpc-types-trace for CallLogFrame
alloy-rpc-types-trace = "1.0"

# Add reth_chain_query for direct database access
reth_chain_query = { path = "../reth_chain_query" }

reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }

[dev-dependencies]
rand = "0.8"
