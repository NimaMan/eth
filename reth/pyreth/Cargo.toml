[package]
name = "pyreth"
version = "0.5.0"
edition = "2021"
authors = ["PyReth Team"]
description = "Python bindings for Reth-based Ethereum tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/pyreth"
readme = "README.md"

[lib]
name = "pyreth"
crate-type = ["cdylib", "rlib"]

[features]
default = ["prices"]
prices = ["eth_prices", "eth_env"]

[dependencies]
# Core dependencies
tx_simulator = { path = "../tx_simulator" }
tx_processor = { path = "../tx_processor" }
reth_chain_query = { path = "../reth_chain_query" }
eth_prices = { path = "../eth_prices", optional = true }
eth_env = { path = "../eth_env", optional = true }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }

# Python bindings
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py39"] }
pyo3-asyncio = { package = "pyo3-asyncio-0-21", version = "0.21", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }

# Core dependencies
eyre = "0.6"
tracing = "0.1"
alloy-primitives = "1.1.2"
alloy-consensus = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
hex = "0.4"
chrono = "0.4"
hex-literal = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Performance
rayon = "1.10"
num_cpus = "1.16"

# Singleton pattern
once_cell = "1.19"
parking_lot = "0.12"

[[example]]
name = "test_simulation"
path = "examples/test_simulation.rs"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
