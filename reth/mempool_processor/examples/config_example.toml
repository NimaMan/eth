# Mempool Processor Configuration Example
# 
# This file contains all configuration options for the mempool processor.
# Copy this file and modify as needed for your deployment.

[ipc]
# Path to Reth IPC socket
socket_path = "/tmp/reth.ipc"
# Buffer size for IPC reads
buffer_size = 65536
# Reconnection delay after disconnect (in seconds)
reconnect_delay = 5
# Maximum reconnection attempts
max_reconnect_attempts = 10

[function_detection]
# Enable function detection
enabled = true
# Batch size for processing transactions
batch_size = 100
# Channel buffer size
channel_buffer_size = 50000
# Processing timeout (in milliseconds)
processing_timeout = 100

[tax_detection]
# Enable tax detection
enabled = true
# Maximum acceptable buy tax (percentage)
max_acceptable_buy_tax = 25
# Maximum acceptable sell tax (percentage)
max_acceptable_sell_tax = 25
# Honeypot sell tax threshold (percentage)
honeypot_sell_threshold = 50
# Alert on any tax change
alert_on_any_change = false
# Alert only on increases
alert_only_increases = true
# Minimum tax change to alert (percentage points)
min_change_threshold = 5

[signal_detection]
# Minimum ETH in pool to track
min_pool_eth = 0.05
# Scam detection ETH threshold
scam_eth_threshold = 0.3
# Scam detection percentage threshold
scam_percentage_threshold = 60.0
# Liquidity warning percentage
liquidity_warning_percentage = 20.0
# Supply increase alert percentage
supply_increase_percentage = 50.0
# Minimum confidence score
min_confidence = 0.7

[simulation]
# Enable transaction simulation
enabled = true
# Reth data directory path
reth_datadir = "/home/nima/.local/share/reth/mainnet"
# Batch size for simulation
batch_size = 50
# Batch timeout (in milliseconds)
batch_timeout = 100
# Maximum queue size
max_queue_size = 1000
# Skip simple transfers
skip_simple_transfers = true
# Minimum value for simulation (in ETH)
min_value_eth = 0.01

[database]
# Enable database writes
enabled = false
# Database connection URL (PostgreSQL)
# url = "postgresql://user:password@localhost/mempool_db"
# Connection pool size
pool_size = 10
# Write batch size
batch_size = 100
# Write interval (in seconds)
write_interval = 10

[zmq]
# Enable ZMQ publishing
enabled = true
# Signal publisher endpoint
signal_endpoint = "tcp://127.0.0.1:5556"
# Alert publisher endpoint
alert_endpoint = "tcp://127.0.0.1:5557"
# Send high water mark
send_hwm = 10000
# Linger period (ms)
linger = 0

[logging]
# Log directory path
log_dir = "/home/nima/code/crypto/logs/mempool"
# Enable file logging
file_logging = true
# Log level (trace, debug, info, warn, error)
level = "info"
# Performance metrics interval (in seconds)
metrics_interval = 60