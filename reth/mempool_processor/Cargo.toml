[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"

[dependencies]

# Real-time JSON-RPC/WebSocket/IPC client
ethers          = { version = "2.0", features = ["ws", "ipc"] }
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
futures-util    = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot     = "0.12"

# Signal handling
ctrlc           = "3.4"

# Async trait support
async-trait     = "0.1"

# Transaction simulation with REVM - Using crates.io versions to match revm_tx_simulator
revm            = { version = "25.0.0", default-features = false, features = ["std", "alloydb", "asyncdb"] }
revm-primitives = { version = "19.2.0", default-features = false, features = ["std", "serde"] }
revm-context    = { version = "6.0.0", default-features = false, features = ["optional_no_base_fee"] }
revm-database   = { version = "5.0.0", default-features = false }

# Alloy dependencies (for revm_tx_simulator_lib interaction)
alloy-eips      = { git = "https://github.com/alloy-rs/alloy.git", branch = "main", default-features = false }
alloy-provider  = { version = "1.0.6", default-features = false, features = ["reqwest", "ws"] }
alloy-network   = { version = "1.0.6" }
alloy-rpc-client = { version = "1.0.9" }


# Reth dependencies for database access
# Reth ExEx dependencies (optional, for direct integration)
reth-exex = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"
lazy_static     = "1.4"

serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
toml            = "0.8"
hex             = "0.4"
fastrand        = "2.0"
tiny-keccak     = { version = "2.0", features = ["keccak"] }

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

# CSV writing for performance monitoring
csv             = "1.3"
thiserror       = "1.0"
anyhow          = "1.0"

# HTTP API server for real-time metrics
warp            = "0.3"

# WebSocket client for measurements
tokio-tungstenite = "0.20"

# Reth direct integration for ultra-fast simulation
reth_tx_simulator = { path = "../reth_tx_simulator" }
tx_processor = { path = "../tx_processor" }
reth-provider = { path = "/home/nima/code/crypto/rust/reth/crates/storage/provider" }
reth-chainspec = { path = "/home/nima/code/crypto/rust/reth/crates/chainspec" }
reth-ethereum = { path = "/home/nima/code/crypto/rust/reth/crates/ethereum/reth" }
reth-ethereum-forks = { path = "/home/nima/code/crypto/rust/reth/crates/ethereum-forks" }
reth-revm = { path = "/home/nima/code/crypto/rust/reth/crates/revm" }
reth-evm = { path = "/home/nima/code/crypto/rust/reth/crates/evm" }
reth-db = { path = "/home/nima/code/crypto/rust/reth/crates/storage/db" }
reth-node-types = { path = "/home/nima/code/crypto/rust/reth/crates/node/types" }
reth-node-ethereum = { path = "/home/nima/code/crypto/rust/reth/crates/ethereum/node" }
reth-primitives = { path = "/home/nima/code/crypto/rust/reth/crates/primitives" }
reth-ethereum-primitives = { path = "/home/nima/code/crypto/rust/reth/crates/ethereum/primitives" }
reth-primitives-traits = { path = "/home/nima/code/crypto/rust/reth/crates/primitives-traits" }
reth-storage-api = { path = "/home/nima/code/crypto/rust/reth/crates/storage/storage-api" }

# Alloy dependencies for transaction decoding
alloy-primitives = { version = "1.0", features = ["rlp"] }
alloy-rlp = "0.3"
# alloy-eips already defined above from git
alloy-consensus = { version = "1.0" }
alloy-sol-types = { version = "1.0" }
alloy-rpc-types = { version = "1.0" }

# REVM for Direct Reth simulation
# Note: Using existing revm 25.0.0 from above
revm-inspectors = "0.19.1"

# Direct Reth simulator
# Removed - replaced by reth_tx_simulator

# For examples
jsonrpsee = { version = "0.24", features = ["http-client"] }

[lib]
name = "mempool_processor"
path = "src/lib.rs"

# Enable tx_processor module tests
[features]
default = []
tx_processor_tests = []
reth_integration = ["reth-exex", "reth-transaction-pool", "reth-node-core"]

[[bin]]
name = "mempool_signal_detector"
path = "src/bin/mempool_signal_detector.rs"

