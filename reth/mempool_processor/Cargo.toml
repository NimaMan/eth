[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"

[dependencies]
# Real-time JSON-RPC/WebSocket/IPC client
ethers          = { version = "2.0", features = ["ws", "ipc"] }
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
futures-util    = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = { version = "0.4", features = ["serde"] }

# Transaction simulation with REVM - Using crates.io versions to match revm_tx_simulator
revm            = { version = "25.0.0", default-features = false, features = ["std", "alloydb", "asyncdb"] }
revm-primitives = { version = "19.2.0", default-features = false, features = ["std", "serde"] }
revm-context    = { version = "6.0.0", default-features = false, features = ["optional_no_base_fee"] }
revm-database   = { version = "5.0.0", default-features = false }

# Alloy dependencies (for revm_tx_simulator_lib interaction)
alloy-eips      = { version = "1.0.0", default-features = false }
alloy-provider  = { version = "1.0.6", default-features = false, features = ["reqwest", "ws"] }
alloy-network   = { version = "1.0.6" }
alloy-rpc-client = { version = "1.0.9" }

# Revm transaction simulator from tx_processor
revm_tx_simulator = { path = "../tx_processor" }

# Reth dependencies for database access
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }

# Reth ExEx dependencies (optional, for direct integration)
reth-exex = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"
lazy_static     = "1.4"

serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
hex             = "0.4"
fastrand        = "2.0"
tiny-keccak     = { version = "2.0", features = ["keccak"] }

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

# CSV writing for performance monitoring
csv             = "1.3"
thiserror       = "1.0"
anyhow          = "1.0"

# HTTP API server for real-time metrics
warp            = "0.3"

# WebSocket client for measurements
tokio-tungstenite = "0.20"

[lib]
name = "mempool_processor"
path = "src/lib.rs"

[[bin]]
name = "mempool_processor"
path = "src/main.rs"

# Enable tx_processor module tests
[features]
default = []
tx_processor_tests = []
reth_integration = ["reth-exex", "reth-transaction-pool", "reth-node-core"]

[[bin]]
name = "mempool_tracker"
path = "src/bin/mempool_tracker.rs"


[[bin]]
name = "metrics_api_server"
path = "src/bin/metrics_api_server.rs"

[[bin]]
name = "mempool_signal_detection_full_tx_ipc"
path = "src/bin/mempool_signal_detection_full_tx_ipc.rs"


[[bin]]
name = "mempool_full_tx_client"
path = "src/bin/mempool_full_tx_client.rs"








# Examples
[[example]]
name = "detect_pool_creation"
path = "examples/detect_pool_creation.rs"

[[example]]
name = "test_pool_subscriber"
path = "examples/pool_detection/test_pool_subscriber.rs"

[[example]]
name = "actual_simulation_measurement"
path = "examples/actual_simulation_measurement.rs"

[[example]]
name = "precise_mempool_latency_measurement"
path = "examples/mempool_fetcher/precise_mempool_latency_measurement.rs"

[[example]]
name = "test_new_full_tx_ipc"
path = "examples/mempool_fetcher/test_new_full_tx_ipc.rs"

[[example]]
name = "validate_full_tx_data"
path = "examples/mempool_fetcher/validate_full_tx_data.rs"

[[example]]
name = "nonblocking_ipc_1k_demo"
path = "examples/mempool_fetcher/nonblocking_ipc_1k_demo.rs"

[[example]]
name = "mempool_health_monitor"
path = "examples/mempool_fetcher/mempool_health_monitor.rs"

[[example]]
name = "long_term_health_test"
path = "examples/mempool_fetcher/long_term_health_test.rs"

[[example]]
name = "mempool_queue_monitor"
path = "examples/mempool_fetcher/mempool_queue_monitor.rs"

[[example]]
name = "verify_new_transactions_only"
path = "examples/mempool_fetcher/verify_new_transactions_only.rs"

# Using crates.io versions - no patches needed
