[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"

[dependencies]
# Real-time JSON-RPC/WebSocket/IPC client
ethers          = { version = "2.0", features = ["ws", "ipc"] }
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
futures-util    = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = { version = "0.4", features = ["serde"] }

# Transaction simulation with REVM - Using latest stable matched pair from user research
revm            = { path = "../revm_tx_simulator/src/revm/crates/revm", default-features = false, features = ["std", "alloydb", "asyncdb"] }
revm-primitives = { path = "../revm_tx_simulator/src/revm/crates/primitives", default-features = false, features = ["std", "serde"] }
revm-context    = { path = "../revm_tx_simulator/src/revm/crates/context", default-features = false, features = ["optional_no_base_fee"] }

# Alloy dependencies (for revm_tx_simulator_lib interaction)
alloy-eips      = { version = "1.0.0", default-features = false }
alloy-provider  = { version = "1.0.6", default-features = false, features = ["reqwest", "ws"] }
alloy-network   = { version = "1.0.6" }
alloy-rpc-client = { version = "1.0.9" }

# Local simulation library
revm_tx_simulator_lib = { path = "../revm_tx_simulator", package = "revm_tx_simulator" }

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"

# State cache with LMDB
lmdb            = "0.8"
serde           = { version = "1.0", features = ["derive"] }

# FlatBuffers schema compiler + runtime
flatbuffers     = "25"
serde_json      = "1.0"
hex             = "0.4"
fastrand        = "2.0"
tiny-keccak     = { version = "2.0", features = ["keccak"] }

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

# CSV writing for performance monitoring
csv             = "1.3"
thiserror       = "1.0"

# HTTP API server for real-time metrics
warp            = "0.3"

# DevP2P networking - for now we'll use ethers IPC client
# The reth IPC implementation is complex and requires local reth source

[lib]
name = "mempool_processor"
path = "src/lib.rs"

[[bin]]
name = "mempool_processor"
path = "src/main.rs"

[[bin]]
name = "scam_detection_service"
path = "src/bin/scam_detection_service.rs"

[[bin]]
name = "metrics_api_server"
path = "src/bin/metrics_api_server.rs"

[[bin]]
name = "revm_performance_monitor"
path = "src/bin/revm_performance_monitor.rs"

# Validation testing binary
[[bin]]
name = "run_validation_tests"
path = "src/bin/run_validation_tests.rs"

# Test binaries
[[bin]]
name = "test_pool_detection"
path = "src/bin/test_pool_detection.rs"

[[bin]]
name = "test_comprehensive_state_diff"
path = "src/bin/test_comprehensive_state_diff.rs"

[[bin]]
name = "test_simulation_engine"
path = "src/bin/test_simulation_engine.rs"

[[bin]]
name = "large_scale_validation"
path = "src/bin/large_scale_validation.rs"

[[bin]]
name = "test_revm_basic"
path = "src/bin/test_revm_basic.rs"

[[bin]]
name = "test_specific_tx"
path = "src/bin/test_specific_tx.rs"

# ───────────────────────────── Patch section (align with revm_tx_simulator) ──────────────────────────────
[patch.crates-io]
revm-primitives  = { path = "../revm_tx_simulator/src/revm/crates/primitives" }
revm-context     = { path = "../revm_tx_simulator/src/revm/crates/context" }
# Add other revm sub-crates from revm_tx_simulator's patch section as needed
# For example:
# revm-inspector   = { path = "../revm_tx_simulator/src/revm/crates/inspector" }
# revm-database    = { path = "../revm_tx_simulator/src/revm/crates/database" }
# revm-state       = { path = "../revm_tx_simulator/src/revm/crates/state"}
# revm-bytecode    = { path = "../revm_tx_simulator/src/revm/crates/bytecode"}
# revm-precompile  = { path = "../revm_tx_simulator/src/revm/crates/precompile"}
# revm-handler     = { path = "../revm_tx_simulator/src/revm/crates/handler"}
# revm-context-interface = { path = "../revm_tx_simulator/src/revm/crates/context/interface" }
# Start with minimal necessary patches (primitives, context), add more if compilation errors indicate missing patches.
# The core 'revm' crate itself is already path-based in [dependencies].
