[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"

[dependencies]

# Real-time JSON-RPC/WebSocket/IPC client
ethers          = { version = "2.0", features = ["ws", "ipc"] }
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
futures-util    = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot     = "0.12"

# LRU cache for bounded memory management
lru             = "0.12"

# Signal handling
ctrlc           = "3.4"

# Async trait support
async-trait     = "0.1"

# Transaction simulation with REVM - align with Reth v1.7.0 toolchain
revm            = { version = "29.0.0", default-features = false, features = ["std", "alloydb", "asyncdb"] }
revm-primitives = { version = "20.2.1", default-features = false, features = ["std", "serde"] }
revm-context    = { version = "9.0.2", default-features = false, features = ["optional_no_base_fee"] }
revm-database   = { version = "7.0.5", default-features = false }

# Alloy dependencies (for revm_tx_simulator_lib interaction)
alloy-eips      = { version = "1.0.32", default-features = false }
alloy-provider  = { version = "1.0.32", default-features = false, features = ["reqwest", "ws"] }
alloy-network   = { version = "1.0.32" }
alloy-rpc-client = { version = "1.0.32" }


# Reth dependencies for database access
# Reth ExEx dependencies (optional, for direct integration)
reth-exex = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"
lazy_static     = "1.4"

serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
toml            = "0.8"
hex             = "0.4"
fastrand        = "2.0"
rlp             = "0.5"

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

# CSV writing for performance monitoring
csv             = "1.3"
thiserror       = "1.0"
anyhow          = "1.0"

# HTTP API server for real-time metrics
warp            = "0.3"

# WebSocket client for measurements
tokio-tungstenite = "0.20"

# Transaction processing with proven tax calculation
tx_processor = { path = "../tx_processor" }
tx_simulator = { path = "../tx_simulator" }
reth_chain_query = { path = "../reth_chain_query" }
# Reth dependencies - using GitHub references to match tx_simulator
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }

# Alloy dependencies for transaction decoding
alloy-primitives = { version = "1.0.32", features = ["rlp"] }
alloy-rlp = "0.3"
# alloy-eips already defined above from crates.io
alloy-consensus = { version = "1.0.32" }
alloy-sol-types = { version = "1.0.32" }
alloy-rpc-types = { version = "1.0.32" }

# REVM for Direct Reth simulation
# Note: Using existing revm 29.0.0 from above
revm-inspectors = "0.29.2"

# Direct Reth simulator
# Removed - replaced by reth_tx_simulator

# For examples
jsonrpsee = { version = "0.24", features = ["http-client"] }

# Database support
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "bigdecimal"] }
rust_decimal = { version = "1.0", features = ["serde-float"] }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", optional = true }

[lib]
name = "mempool_processor"
path = "src/lib.rs"

# Enable tx_processor module tests
[features]
# Enable database-related writers by default; can be disabled for example-only runs
default = ["db"]
db = []
tx_processor_tests = []
reth_integration = ["reth-exex", "reth-transaction-pool", "reth-node-core"]
arrival_mdbx = ["reth-libmdbx"]

[[bin]]
name = "mempool_signal_detector"
path = "src/bin/mempool_signal_detector.rs"


