[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"

[dependencies]
# Real-time JSON-RPC/WebSocket client
ethers          = { version = "2.0", features = ["ws"] }
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = "0.4"

# Transaction simulation with REVM - Using latest stable matched pair from user research
revm            = { version = "19.0.0", features = ["std", "serde"] }
revm-primitives = "19.0.0"

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"

# State cache with LMDB
lmdb            = "0.8"
serde           = { version = "1.0", features = ["derive"] }

# FlatBuffers schema compiler + runtime
flatbuffers     = "25"
serde_json      = "1.0"
hex             = "0.4"
fastrand        = "2.0"

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

[lib]
name = "mempool_processor"
path = "src/lib.rs"

[[bin]]
name = "mempool_processor"
path = "src/main.rs"

[[bin]]
name = "scam_detection_service"
path = "src/bin/scam_detection_service.rs"

[[bin]]
name = "performance_monitor"
path = "src/bin/performance_monitor.rs"

# Test binaries
[[bin]]
name = "test_state_diff"
path = "src/bin/tests/test_state_diff.rs"

[[bin]]
name = "simulate_tx"
path = "src/bin/tests/test_simulate_tx.rs"

[[bin]]
name = "test_pool_subscriber"
path = "src/bin/tests/test_pool_subscriber.rs"

[[bin]]
name = "test_scam_detection"
path = "src/bin/tests/test_scam_detection.rs"

[[bin]]
name = "test_db_logger"
path = "src/bin/tests/test_db_logger.rs"

[[bin]]
name = "test_scam_detection_pipeline"
path = "src/bin/tests/test_scam_detection_pipeline.rs"

[[bin]]
name = "test_scam_detection_integration"
path = "src/bin/tests/test_scam_detection_integration.rs"

[[bin]]
name = "test_live_pool_monitoring"
path = "src/bin/tests/test_live_pool_monitoring.rs"

[[bin]]
name = "test_state_cache"
path = "src/bin/tests/test_state_cache.rs"

[[bin]]
name = "test_mempool"
path = "src/bin/tests/test_mempool.rs"


[[bin]]
name = "test_pool_detection"
path = "src/bin/test_pool_detection.rs"

[[bin]]
name = "test_state_simulation"
path = "src/bin/test_state_simulation.rs"
