[package]
name = "reth_chain_query"
version = "0.1.0"
edition = "2021"
authors = ["Nima"]
description = "Direct blockchain state queries using Reth database"
license = "MIT"

[dependencies]
# Core dependencies
alloy-primitives = "1.0.0"
alloy-consensus = "1.0.0"
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex-literal = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
futures = "0.3"

# Transaction simulator for database access
tx_simulator = { path = "../tx_simulator" }

# Reth dependencies for provider types
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db-models = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }

# PostgreSQL support
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "chrono", "bigdecimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# For decoding ABI responses
alloy-sol-types = "0.8"
alloy-rlp = "0.3"
alloy-provider = "1.0"
alloy-transport = "1.0"
once_cell = "1.21.3"
parking_lot = "0.12"

# For RPC verification examples
jsonrpsee = { version = "0.24", features = ["http-client"] }
alloy-rpc-types-trace = "1.0"

# Quickstart examples
[[example]]
name = "setup"
path = "examples/quickstart/setup.rs"

[[example]]
name = "common_patterns"
path = "examples/quickstart/common_patterns.rs"

# Address State examples
[[example]]
name = "balances"
path = "examples/address_state/balances.rs"

[[example]]
name = "portfolio"
path = "examples/address_state/portfolio.rs"

[[example]]
name = "batch_operations"
path = "examples/address_state/batch_operations.rs"

[[example]]
name = "balance_changes"
path = "examples/address_state/balance_changes.rs"

[[example]]
name = "historical_analysis"
path = "examples/address_state/historical_analysis.rs"

# Transaction examples
[[example]]
name = "lookup_and_receipts"
path = "examples/transactions/lookup_and_receipts.rs"

[[example]]
name = "block_transactions"
path = "examples/transactions/block_transactions.rs"

[[example]]
name = "verify_receipts_rpc_equivalence"
path = "examples/transactions/verify_receipts_rpc_equivalence.rs"

[[example]]
name = "block_trace_integration"
path = "examples/transactions/block_trace_integration.rs"

# Token examples
[[example]]
name = "token_info"
path = "examples/tokens/token_info.rs"

# Storage examples
[[example]]
name = "read_storage"
path = "examples/storage/read_storage.rs"

# DeFi examples
[[example]]
name = "dex_pools"
path = "examples/defi/dex_pools.rs"

# Entity monitoring examples
[[example]]
name = "cex_monitoring"
path = "examples/entities/cex_monitoring.rs"

[dev-dependencies]
tokio-test = "0.4"
hex = "0.4"
