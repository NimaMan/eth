[package]
name = "reth_chain_query"
version = "0.1.0"
edition = "2021"
authors = ["Nima"]
description = "Direct blockchain state queries using Reth database"
license = "MIT"

[dependencies]
# Core dependencies
alloy-primitives = "1.0.0"
alloy-consensus = "1.0.0"
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex-literal = "0.4"
futures = "0.3"

# Transaction simulator for database access
tx_simulator = { path = "../tx_simulator" }

# Reth dependencies for provider types
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db-models = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-stages-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-prune-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }

# PostgreSQL support
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "chrono", "bigdecimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# For ABI encoding/decoding
alloy-rlp = "0.3"
alloy-provider = "1.0"
alloy-transport = "1.0"
once_cell = "1.21.3"
parking_lot = "0.12"

# For RPC verification examples
jsonrpsee = { version = "0.24", features = ["http-client"] }
alloy-rpc-types-trace = "1.0"

# Quickstart examples
[[example]]
name = "setup"
path = "examples/quickstart/setup.rs"


# Address State examples
[[example]]
name = "balances"
path = "examples/address_state/balances.rs"

[[example]]
name = "batch_operations"
path = "examples/address_state/batch_operations.rs"

[[example]]
name = "balance_changes"
path = "examples/address_state/balance_changes.rs"

[[example]]
name = "historical_analysis"
path = "examples/address_state/historical_analysis.rs"

# Address tx blocks example
[[example]]
name = "address_tx_blocks"
path = "examples/address_state/address_tx_blocks.rs"


# Transaction examples
[[example]]
name = "fetch_block_tx_and_receipts_simple"
path = "examples/transactions/fetch_block_tx_and_receipts_simple.rs"

[[example]]
name = "test_block_fetching"
path = "examples/transactions/test_block_fetching.rs"

[[example]]
name = "fetch_transaction_data_receipts_and_traces"
path = "examples/transactions/fetch_transaction_data_receipts_and_traces.rs"

[[example]]
name = "verify_receipts_rpc_equivalence"
path = "examples/transactions/verify_receipts_rpc_equivalence.rs"

# Token examples
[[example]]
name = "token_metadata_basic"
path = "examples/tokens/token_metadata_basic.rs"

[[example]]
name = "stablecoin_total_supply"
path = "examples/entities/stablecoin_total_supply.rs"

[[example]]
name = "token_supply_historical"
path = "examples/tokens/token_supply_historical.rs"

[[example]]
name = "token_comprehensive_info"
path = "examples/tokens/token_comprehensive_info.rs"

[dev-dependencies]
tokio-test = "0.4"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# DeFi examples
[[example]]
name = "verify_dex_pool_computation"
path = "examples/defi/verify_dex_pool_computation.rs"

[[example]]
name = "liquidity_readers"
path = "examples/defi/liquidity_readers.rs"
[[example]]
name = "tx_arrival_index_smoke"
path = "examples/reth_index/tx_arrival_index_smoke.rs"

[[example]]
name = "delete_tx_arrival"
path = "examples/reth_index/delete_tx_arrival.rs"

[[example]]
name = "list_tx_arrivals"
path = "examples/reth_index/list_tx_arrivals.rs"

[[example]]
name = "write_arrival_for_hash"
path = "examples/reth_index/write_arrival_for_hash.rs"
