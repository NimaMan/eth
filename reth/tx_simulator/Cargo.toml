[package]
name = "tx_simulator"
version = "0.2.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
futures = "0.3"

# Ethereum types
alloy-primitives = { version = "1.3.1", features = ["rlp"] }
alloy-rlp = "0.3"
alloy-rpc-types-trace = "1.0.27"
alloy-rpc-types-eth = "1.0.27"
alloy-consensus = "1.0.27"
alloy-eips = "1.0.27"
hex = "0.4"

# Reth dependencies - using GitHub references
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2" }

# REVM - aligned with Reth v1.8.2 toolchain
revm = { version = "30.0.0", default-features = false, features = ["std"] }
revm-inspectors = "0.30.0"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
bincode = "1.3"
once_cell = "1.18"
reqwest = { version = "0.12", features = ["json"] }

# For RPC benchmarking
jsonrpsee = { version = "0.24", features = ["http-client"] }

[dev-dependencies]
alloy-rlp = "0.3"
secrecy = "0.8"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
reth_chain_query = { path = "../reth_chain_query" }

