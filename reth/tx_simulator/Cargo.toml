[package]
name = "tx_simulator"
version = "0.2.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
futures = "0.3"

# Ethereum types
alloy-primitives = { version = "1.3.1", features = ["rlp"] }
alloy-rlp = "0.3"
alloy-rpc-types-trace = "1.0.27"
alloy-rpc-types-eth = "1.0.27"
alloy-consensus = "1.0.27"
hex = "0.4"

# Reth dependencies - using GitHub references
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.6.0" }

# REVM - exact version Reth uses
revm = { version = "27.1.0", default-features = false, features = ["std"] }
revm-inspectors = "0.27.2"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For RPC benchmarking
jsonrpsee = { version = "0.24", features = ["http-client"] }

[dev-dependencies]
ethers = { version = "2.0.7", features = ["rustls"] }
alloy-rlp = "0.3"
reth_chain_query = { path = "../reth_chain_query" }
reth-storage-api = { path = "../reth/crates/storage/storage-api" }
secrecy = "0.8"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

