# ETH Kartal Production Configuration

[system]
environment = "production"
log_level = "info"
log_file = "/var/log/kartal/app.log"
metrics_port = 9090
healthcheck_port = 8080

[alerts]
zmq_endpoint = "tcp://localhost:5558"
queue_size = 10000
processing_threads = 4
reconnect_interval_secs = 5

[wallet]
type = "hardware"                          # Use hardware wallet in production
# hardware_derivation = "m/44'/60'/0'/0/0"
max_gas_price_gwei = 500

[strategies]
enable_emergency_sell = true
enable_partial_exit = true
enable_arbitrage = true
enable_liquidity_provision = false

[strategies.thresholds]
emergency_sell_loss_percent = 80
partial_exit_loss_percent = 50
min_pool_size_eth = 1.0
min_profit_eth = 0.05

[strategies.slippage]
emergency_max_slippage = 0.30
high_priority_slippage = 0.15
normal_slippage = 0.05

[risk]
max_position_eth = 10.0
max_daily_loss_eth = 5.0
max_consecutive_failures = 5
circuit_breaker_enabled = true

[risk.position_limits]
max_percent_of_pool = 0.05
concentration_limit = 0.25
max_tokens_held = 20

[risk.circuit_breaker]
cooldown_seconds = 300
emergency_shutdown_loss_eth = 10.0

[execution]
simulation_required = true
max_gas_limit = 3000000
gas_price_multiplier = 1.2
use_flashbots = true
use_mev_protection = true

[execution.rpcs]
primary = "http://localhost:8545"
fallback = [
    # Add your production RPC endpoints here
    # "https://eth-mainnet.alchemyapi.io/v2/YOUR_KEY",
    # "https://mainnet.infura.io/v3/YOUR_KEY"
]
flashbots_relay = "https://relay.flashbots.net"

[routers]
uniswap_v2 = "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
uniswap_v3 = "0xE592427A0AEce92De3Edee1F18E0157C05861564"
sushiswap = "0xd9e1cE17f2641f24aE83637ab66a2cca9C378B9F"

[monitoring]
enable_metrics = true
enable_alerts = true
# alert_webhook = "https://discord.com/api/webhooks/YOUR_WEBHOOK"
performance_log_interval_secs = 60

[monitoring.alerts]
critical_loss_eth = 1.0
high_slippage_percent = 10
low_success_rate = 0.8