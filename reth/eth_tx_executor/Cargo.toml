[workspace]
resolver = "2"
members = [
    ".",
    "tx_ranking_system"
]

[package]
name = "eth_kartal"
version = "0.1.0"
edition = "2021"
description = "Fast Ethereum response system for scam detection and automated actions"
authors = ["Nima Manaf <nima.manaf8@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Internal dependencies
tx_ranking_system = { path = "tx_ranking_system" }

# Ethereum libraries
ethers = { version = "2.0.7", features = ["ws", "rustls"] }
revm = { version = "3.3.0", features = ["std", "serde", "ethersdb"] }

# Async runtime
tokio = { version = "1.28", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for data integration
reqwest = { version = "0.11", features = ["json"] }
futures-util = "0.3"

# Database
tokio-postgres = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# Security
ring = "0.17"  # HMAC for alert validation
base64 = "0.21"  # For HMAC encoding

# Messaging
zmq = "0.10"

# Command line parsing
clap = { version = "4.3.1", features = ["derive", "env"] }

# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
thiserror = "1.0"

# Utilities
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.7"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Security - New dependencies for secure key management
eth-keystore = "0.5"  # Ethereum keystore encryption/decryption
zeroize = { version = "1.6", features = ["derive"] }  # Secure memory clearing
secrecy = "0.8"  # Secret value wrapper
rpassword = "7.2"  # Secure password input
rand = "0.8"  # Random number generation for keystore

[dev-dependencies]
mockall = "0.11"
tokio-test = "0.4"
tempfile = "3.8"  # For testing keystore files

[[bin]]
name = "kartal"
path = "src/bin/kartal.rs"

[[bin]]
name = "keystore_manager"
path = "src/bin/keystore_manager.rs"

# Wallet examples
[[example]]
name = "swap_sim_with_kartal_kilit"
path = "examples/wallet/swap_sim_with_kartal_kilit.rs"

# Database integration examples
[[example]]
name = "signal_generator"
path = "examples/db_integration/signal_generator.rs"

[[example]]
name = "signal_processor"
path = "examples/db_integration/signal_processor.rs"

[[example]]
name = "position_updater"
path = "examples/db_integration/position_updater.rs"

[[example]]
name = "full_integration_demo"
path = "examples/db_integration/full_integration_demo.rs"

# Trading examples
[[example]]
name = "risk_check_demo"
path = "examples/trading/risk_check_demo.rs"

[[example]]
name = "risk_integrated_trading"
path = "examples/trading/risk_integrated_trading.rs"

# Additional binaries to be added as implemented
