[package]
name = "ethers"
version = "0.0.1"
edition = "2021"

[dependencies]
ethers-core = { version = "2.0.14", features = ["eip712"] }
ethers-signers = "2.0.14"
hex = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["time"] }
