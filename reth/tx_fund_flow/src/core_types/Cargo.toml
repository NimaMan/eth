[package]
name = "tx_fund_flow-core-types"
version = "0.1.0"
edition = "2021"
description = "Core types, errors, and utilities for TX_FUND_FLOW analytics"

[dependencies]
# Ethereum types
alloy-primitives = { workspace = true }
hex = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling  
anyhow = { workspace = true }
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

# Database types
sqlx = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Utilities
rand = "0.8"
regex = "1.10"
sha2 = "0.10"

# Logging
tracing = { workspace = true }

[dev-dependencies]
# Property-based testing
proptest = "1.4"
# Additional test utilities
tokio-test = "0.4"

[features]
default = []

[[test]]
name = "validation_tests"
path = "tests/validation_tests.rs"

[[test]]
name = "resilience_tests"
path = "tests/resilience_tests.rs"
required-features = ["tokio/full"]

[[test]]
name = "error_handling_tests"
path = "tests/error_handling_tests.rs"