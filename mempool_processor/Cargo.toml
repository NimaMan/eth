[package]
name      = "mempool_processor"
version   = "0.1.0"
edition   = "2021"
workspace = "../reth"

[dependencies]

# Real-time JSON-RPC/WebSocket/IPC client
tokio           = { version = "1.37", features = ["full"] }
tokio-stream    = "0.1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
once_cell       = "1.19"
clap            = { version = "4.5", features = ["derive","env"] }
eyre            = "0.6"
# Inter-thread queue inside Rust
flume           = "0.11"
# Futures for parallel batch processing
futures         = "0.3"
futures-util    = "0.3"
# HTTP client for optimized fetching
reqwest         = "0.11"
# URL handling
url             = "2.5"

# ZeroMQ PUB/SUB to Python
zmq             = "0.10"

# Time handling
chrono          = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot     = "0.12"

# LRU cache for bounded memory management
lru             = "0.12"

# Signal handling
ctrlc           = "3.4"

# Async trait support
async-trait     = "0.1"

# Alloy dependencies for transaction decoding and RPC clients.
alloy-eips      = "2.0.4"
alloy-provider  = { version = "1.0.38", default-features = false, features = ["reqwest", "ws"] }
alloy-network   = { version = "1.0.38" }
alloy-rpc-client = { version = "1.0.38" }


# Reth dependencies for database access
# Reth ExEx dependencies (optional, for direct integration)
reth-exex = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }

bytes           = "1.5"
ethereum-types  = "0.14"
ethabi          = "18.0"
lazy_static     = "1.4"
redis           = { version = "0.32.7", features = ["tokio-comp", "safe_iterators"] }

serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
toml            = "0.8"
hex             = "0.4"
fastrand        = "2.0"
rlp             = "0.5"

# PostgreSQL Client for database logging
tokio-postgres  = "0.7"

# CSV writing for performance monitoring
csv             = "1.3"
thiserror       = "1.0"
anyhow          = "1.0"

# HTTP API server for real-time metrics
warp            = "0.3"

# WebSocket client for measurements
tokio-tungstenite = "0.20"

# Transaction processing with proven tax calculation
eth_live_feed = { path = "../alpha/live/feed" }
tx_processor = { path = "../reth/tx_processor" }
tx_simulator = { path = "../tx_simulator" }
reth_chain_query = { path = "../reth/reth_chain_query" }
# Alloy dependencies for transaction decoding
alloy-primitives = { version = "1.5.7", features = ["rlp"] }
alloy-rlp = "0.3"
alloy-consensus = "2.0.4"
alloy-sol-types = "1.5.7"
alloy-rpc-types = "1.0.38"

# Direct Reth simulator
# Removed - replaced by reth_tx_simulator

# For examples
jsonrpsee = { version = "0.24", features = ["http-client"] }

# Database support
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "chrono", "bigdecimal"] }
rust_decimal = { version = "1.0", features = ["serde-float"] }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", branch = "main", optional = true }

[lib]
name = "mempool_processor"
path = "src/lib.rs"

# Enable tx_processor module tests
[features]
# Enable database-related writers by default; can be disabled for example-only runs
default = ["db"]
db = []
tx_processor_tests = []
reth_integration = ["reth-exex", "reth-transaction-pool", "reth-node-core"]
arrival_mdbx = ["reth-libmdbx"]

[[bin]]
name = "mempool_signal_detector"
path = "src/bin/mempool_signal_detector.rs"


# Examples

[[example]]
name = "mempool_fetcher_performance_monitor"
path = "examples/mempool_fetcher/mempool_fetcher_performance_monitor.rs"

[[example]]
name = "verify_new_transactions_only"
path = "examples/mempool_fetcher/verify_new_transactions_only.rs"

[[example]]
name = "measure_instant_fetch_performance"
path = "examples/mempool_fetcher/measure_instant_fetch_performance.rs"

[[example]]
name = "function_detector_example"
path = "examples/mempool_fetcher/function_detector_example.rs"

[[example]]
name = "test_fetcher_simple"
path = "examples/mempool_fetcher/test_fetcher_simple.rs"

[[example]]
name = "tx_router_example"
path = "examples/tx_router/tx_router_example.rs"

[[example]]
name = "replay_contract_creation"
path = "examples/simulator/replay_contract_creation.rs"

[[example]]
name = "replay_liquidity_removal"
path = "examples/simulator/replay_liquidity_removal.rs"

[[example]]
name = "replay_trading_status"
path = "examples/simulator/replay_trading_status.rs"

[[example]]
name = "test_unified_writer"
path = "examples/test_unified_writer.rs"

[[example]]
name = "full_pipeline_signal_detection"
path = "examples/signal_detector/full_signal_detection_pipeline.rs"

[[example]]
name = "export_all_tokens_from_cache_to_csv"
path = "examples/token_tracking/export_all_tokens_from_cache_to_csv.rs"

[[example]]
name = "replay_trading_enabled_signal"
path = "examples/signal_detector/replay_trading_enabled_signal.rs"
