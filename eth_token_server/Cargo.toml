[package]
name = "eth_token_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
workspace = ".."

[dependencies]
eth_alpha_store = { path = "../alpha/store" }
eth_block_tx_rank = { path = "../alpha/block_tx_rank" }
eth_live_feed = { path = "../alpha/live/feed" }
eth_pipeline_telemetry = { path = "../eth_pipeline_telemetry" }
eth_pool_classification = { path = "../alpha/pool_classification" }
eth_price = { path = "../eth_price" }
eth_token = { path = "../eth_token" }
reth_chain_query = { path = "../reth_chain_query" }
tx_processor = { path = "../tx_processor" }

alloy-primitives = "1.5.7"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eyre.workspace = true
serde.workspace = true
serde_json.workspace = true
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres"] }
tokio.workspace = true
zstd = "0.13"

futures-util = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
warp = "0.3"
