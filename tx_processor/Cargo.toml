[package]
name    = "tx_processor"
version = "0.4.0"
edition = "2021"
workspace = ".."

[[bin]]
name = "dump_pblock"
path = "src/bin/dump_pblock.rs"

[features]
default = []

# Transaction processing examples
[[example]]
name = "process_transaction_by_hash"
path = "examples/processing/tx_by_hash.rs"

[[example]]
name = "processed_tx_from_unsigned_tx"
path = "examples/processing/unsigned_tx.rs"

[[example]]
name = "bribe_detection"
path = "examples/processing/bribe_detection.rs"

[[example]]
name = "liquidity_removal_detection"
path = "examples/processing/liquidity_removal_detection.rs"

# Block processing examples
[[example]]
name = "dump_pblock"
path = "examples/blocks/dump_pblock.rs"

[[example]]
name = "process_block"
path = "examples/blocks/process.rs"

[[example]]
name = "process_block_batch"
path = "examples/blocks/process_batch.rs"

[[example]]
name = "profile_processed_blocks"
path = "examples/blocks/profile/main.rs"

[[example]]
name = "profile_processed_block_range_throughput"
path = "examples/blocks/profile/range_throughput.rs"

[[example]]
name = "compare_block_sources"
path = "examples/blocks/compare_sources.rs"

[[example]]
name = "refresh_processed_block_disk_cache"
path = "examples/blocks/cache/refresh_disk_cache.rs"

# Processed provider examples
[[example]]
name = "provider_process_block"
path = "examples/providers/processed_block.rs"

[[example]]
name = "provider_token_transactions"
path = "examples/providers/token_transactions.rs"

[[example]]
name = "fetch_processed_tx"
path = "examples/providers/processed_tx.rs"

[[example]]
name = "inspect_tx_bribe"
path = "examples/providers/inspect_tx_bribe.rs"

[[example]]
name = "inspect_tx_erc20_calls"
path = "examples/providers/inspect_tx_erc20_calls.rs"

# Trade simulation examples
[[example]]
name = "erc20_pool_tax_demo"
path = "examples/trade_simulation/viability/tax_demo.rs"

[[example]]
name = "erc20_pool_block_range_analysis"
path = "examples/trade_simulation/viability/block_range.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v2"
path = "examples/trade_simulation/viability/uniswap_v2_common_tokens.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v3"
path = "examples/trade_simulation/viability/uniswap_v3_common_tokens.rs"

[[example]]
name = "can_buy_sell_common_tokens_uniswap_v4"
path = "examples/trade_simulation/viability/uniswap_v4_common_pools.rs"

[[example]]
name = "probe_uniswap_v4_pool"
path = "examples/trade_simulation/probes/uniswap_v4_pool.rs"

[[example]]
name = "probe_sell_swap"
path = "examples/trade_simulation/probes/sell_swap.rs"

[[example]]
name = "probe_pool_buy_sell"
path = "examples/trade_simulation/probes/pool_buy_sell.rs"

[[example]]
name = "can_buy_sell_common_tokens_pancakeswap_v3"
path = "examples/trade_simulation/viability/pancakeswap_v3_common_tokens.rs"

[[example]]
name = "can_buy_sell_common_tokens_multi_v2"
path = "examples/trade_simulation/viability/multi_v2_common_tokens.rs"

[[example]]
name = "usdc_to_dai_uniswap_v3"
path = "examples/trade_simulation/viability/usdc_to_dai_v3.rs"

[[example]]
name = "check_token_server_uniswap_v3_pools"
path = "examples/trade_simulation/diagnostics/check_token_server_uniswap_v3_pools.rs"

[[example]]
name = "token_metadata_with_prior_tx"
path = "examples/metadata/token_metadata_with_prior_tx.rs"

[[example]]
name = "denom_token_metadata"
path = "examples/metadata/denom_tokens.rs"

[dependencies]
tx_simulator = { path = "../tx_simulator" }


# Basic dependencies
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
hex-literal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
alloy-primitives = { version = "1.5.7", features = ["rlp"] }
alloy-eips = "2.0.4"
rlp = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
lazy_static = "1.5"
bincode = "1.3"
zstd = "0.13"
libc = "0.2"

# Basic Alloy dependencies for examples
alloy-consensus = "2.0.4"

# Add jsonrpsee for RPC calls
jsonrpsee = { version = "0.24", features = ["client", "ws-client", "http-client"] }

# Add alloy-rpc-types-trace for CallLogFrame
alloy-rpc-types-trace = "2.0.4"

# Add reth_chain_query for direct database access
reth_chain_query = { path = "../reth_chain_query" }

reth-provider = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-primitives-traits = { version = "0.3.1", features = ["secp256k1"] }

[dev-dependencies]
rand = "0.8"
