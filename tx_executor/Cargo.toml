[package]
name = "tx_executor"
version = "0.1.0"
edition = "2021"
description = "Ethereum transaction executor for prepared direct transactions"

[workspace]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ethers-core = "2.0.14"
ethers-providers = { version = "2.0.14", default-features = false, features = ["rustls"] }
ethers-signers = "2.0.14"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.19", features = ["v4", "serde"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "submit_direct_raw"
path = "examples/submit_direct_raw.rs"
