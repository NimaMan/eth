[workspace]
resolver = "2"
members = [
    "tx_executor",
    "tx_executor_service",
    "tx_executor_signer",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.7"
chrono = { version = "0.4", features = ["serde"] }
config = "0.13"
ethers-core = "2.0.14"
ethers-providers = { version = "2.0.14", default-features = false, features = ["rustls"] }
ethers-signers = "2.0.14"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4", "serde"] }

