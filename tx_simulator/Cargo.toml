[package]
name = "tx_simulator"
version = "0.2.0"
edition = "2021"
workspace = ".."

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }

# Ethereum types
alloy-primitives = { version = "1.5.7", features = ["rlp"] }
alloy-sol-types = "1.5.7"
alloy-rlp = "0.3.15"
alloy-rpc-types-trace = "2.0.4"
alloy-rpc-types-eth = "2.0.4"
alloy-consensus = "2.0.4"
alloy-eips = "2.0.4"
hex = "0.4"

# Reth dependencies - using GitHub references
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-primitives-traits = { version = "0.3.1", features = ["secp256k1"] }
reth-tasks = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }

# REVM - aligned with the current Reth main branch toolchain
revm = { version = "38.0.0", default-features = false, features = ["std"] }
revm-database = { version = "13.0.1", features = ["serde"] }
revm-inspectors = "0.39.0"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For RPC benchmarking
jsonrpsee = { version = "0.24", features = ["http-client"] }

[dev-dependencies]
alloy-rlp = "0.3.15"
secrecy = "0.8"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

