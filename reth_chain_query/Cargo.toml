[package]
name = "reth_chain_query"
version = "0.2.0"
edition = "2021"
authors = ["Nima"]
description = "Direct blockchain state queries using Reth database"
license = "MIT"
workspace = ".."

[dependencies]
# Core dependencies
alloy-primitives = { version = "1.5.7", features = ["rlp"] }
alloy-consensus = "2.0.4"
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex-literal = "0.4"
hex = "0.4"
futures = "0.3"

# Transaction simulator for database access
tx_simulator = { path = "../tx_simulator" }

# Reth dependencies for provider types
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-db-models = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-primitives-traits = { version = "0.3.1", features = ["secp256k1"] }
reth-prune-types = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-stages-types = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth.git", branch = "main" }

# PostgreSQL support
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "bigdecimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# For ABI encoding/decoding
alloy-rlp = "0.3"
alloy-provider = "1.0"
alloy-rpc-types-eth = "1.0"
alloy-transport = "1.0"
alloy-eips = "2.0.4"
once_cell = "1.21.3"
parking_lot = "0.12"
lru = "0.12"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
tokio-stream = "0.1"

# For RPC verification examples
jsonrpsee = { version = "0.24", features = ["http-client", "ws-client"] }
alloy-rpc-types-trace = "2.0.4"

# Address State examples
[[example]]
name = "balances"
path = "examples/address_state/balances.rs"

[[example]]
name = "batch_operations"
path = "examples/address_state/batch_operations.rs"

[[example]]
name = "balance_changes"
path = "examples/address_state/balance_changes.rs"

[[example]]
name = "historical_analysis"
path = "examples/address_state/historical_analysis.rs"

# Address tx blocks example
[[example]]
name = "account_history_blocks"
path = "examples/address_state/account_history_blocks.rs"

# Transaction examples
[[example]]
name = "fetch_transaction_data_receipts_and_traces"
path = "examples/transactions/fetch_transaction_data_receipts_and_traces.rs"

[[example]]
name = "fetch_transaction_by_number"
path = "examples/transactions/fetch_transaction_by_number.rs"

[[example]]
name = "verify_receipts_rpc_equivalence"
path = "examples/transactions/verify_receipts_rpc_equivalence.rs"

[[example]]
name = "verify_block_receipts_rpc_equivalence"
path = "examples/block/verify_block_receipts_rpc_equivalence.rs"

[[example]]
name = "stablecoin_total_supply"
path = "examples/entities/stablecoin_total_supply.rs"

# Token examples
[[example]]
name = "token_inspection"
path = "examples/tokens/token_inspection.rs"

[[example]]
name = "token_blocks"
path = "examples/tokens/token_blocks.rs"

[dev-dependencies]
tokio-test = "0.4"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# DeFi examples
