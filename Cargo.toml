[workspace]
resolver = "2"
members = [
    "alpha/core",
    "alpha/engine",
    "alpha/backtest",
    "alpha/lab",
    "alpha/block_tx_rank",
    "alpha/store",
    "alpha/strategies",
    "alpha/live/state",
    "alpha/live/feed",
    "alpha/live/trading",
    "alpha/live/runner",
    "eth_ops_events",
    "tx_simulator",
    "tx_processor",
    "reth_chain_query",
    "eth_token",
    "eth_pnl_store",
    "eth_price",
    "eth_chain_server",
    "mempool_processor",
    "pyreth",
    "risk_atlas",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
alloy-primitives = { version = "1.5.7", features = ["rlp", "serde"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1", features = ["serde-with-str"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "derive", "rust_decimal"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
