[package]
name = "fundflownetwork_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "fundflownetwork_py"
crate-type = ["cdylib"]

[dependencies]
# Core dependencies
tx_fund_flow-fundflownetwork = { path = "../fundflownetwork" }
tx_fund_flow-core-types = { path = "../core_types" }
tx_fund_flow-eth-db-fetcher = { path = "../eth_db_fetcher" }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

# Async runtime
tokio = { workspace = true }
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Ethereum types
alloy-primitives = { workspace = true }

# Error handling
eyre = "0.6"
