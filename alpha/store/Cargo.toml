[package]
name = "eth_alpha_store"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
workspace = "../.."

[dependencies]
async-trait = "0.1"
eth_alpha_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
