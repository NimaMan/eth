[package]
name = "eth_alpha_backtest"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
workspace = "../.."

[dependencies]
alloy-primitives = "1.5.7"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
eth_alpha_core = { path = "../core" }
eth_alpha_engine = { path = "../engine" }
eth_alpha_store = { path = "../store" }
eth_strategies = { path = "../strategies" }
eyre = "0.6"
rust_decimal = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tx_processor = { path = "../../tx_processor" }
tx_simulator = { path = "../../tx_simulator" }
