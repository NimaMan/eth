[package]
name = "eth_alpha_core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
workspace = "../.."

[dependencies]
alloy-primitives = { version = "1.5.7", features = ["serde"] }
async-trait = "0.1"
eyre = "0.6"
rust_decimal = { version = "1.36", features = ["serde", "serde-float", "serde-arbitrary-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
